name: Setup
description: "Setup the environment"

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: zulu
        java-version: '21'
    # Caches dependencies and Gradle's build cache between runs so unchanged tasks are skipped
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Setup Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: "platform-tools build-tools;36.0.0"
