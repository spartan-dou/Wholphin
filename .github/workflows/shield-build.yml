name: Shield build

on:
  workflow_dispatch:
  push:
    branches:
      - shield-fix

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx8g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Get version name
        run: |
          echo "VERSION_NAME=$(git describe --tags --match 'v*' --long)" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          # Release signing secrets are optional, without them the shared throwaway key is used
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ github.actor }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.GITHUB_TOKEN }}"
        run: ./gradlew assembleDefaultRelease --build-cache --parallel
      - name: Name the APKs like the in-app updater expects
        # It picks Wholphin-<first supported ABI>.apk: armeabi-v7a on the Shield, arm64-v8a on a tablet
        run: |
          for ABI in armeabi-v7a arm64-v8a; do
            APK=$(find app/build/outputs/apk/default/release -name "*-${ABI}.apk" | head -1)
            test -n "$APK" || { echo "No $ABI APK"; exit 1; }
            echo "Using $APK"
            cp "$APK" "Wholphin-${ABI}.apk"
          done
          sha256sum Wholphin-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "shield-${GITHUB_RUN_NUMBER}" \
            --target "${GITHUB_SHA}" --latest --title "${VERSION_NAME}" \
            -n "Shield (armeabi-v7a) and tablet (arm64-v8a) build of ${GITHUB_SHA}" \
            Wholphin-armeabi-v7a.apk Wholphin-arm64-v8a.apk
