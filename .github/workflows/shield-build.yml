name: Shield build

on:
  workflow_dispatch:
  push:
    branches:
      - shield-fix

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ github.actor }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.GITHUB_TOKEN }}"
        run: ./gradlew assembleAppstoreDebug
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wholphin-shield-debug
          path: app/build/outputs/apk/appstore/debug/*.apk
