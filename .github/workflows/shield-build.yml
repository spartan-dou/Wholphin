name: Shield build

on:
  workflow_dispatch:
  push:
    branches:
      - shield-fix

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Get version name
        run: |
          echo "VERSION_NAME=$(git describe --tags --match 'v*' --long)" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          # Release signing secrets are optional, without them the shared throwaway key is used
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ github.actor }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.GITHUB_TOKEN }}"
        run: ./gradlew assembleDefaultRelease
      - name: Name the APK like the in-app updater expects
        run: |
          APK=$(find app/build/outputs/apk/default/release -name '*armeabi-v7a.apk' | head -1)
          echo "Using $APK"
          cp "$APK" Wholphin-armeabi-v7a.apk
          sha256sum Wholphin-armeabi-v7a.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "shield-${GITHUB_RUN_NUMBER}" \
            --target "${GITHUB_SHA}" --latest --title "${VERSION_NAME}" \
            -n "Shield build of ${GITHUB_SHA}" \
            Wholphin-armeabi-v7a.apk
