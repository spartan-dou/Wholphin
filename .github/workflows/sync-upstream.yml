name: Sync upstream

# Rebases the Shield branch on the original Wholphin repository every night and builds it.
# If the rebase conflicts nothing is pushed and the run fails, so the branch stays on its last working state.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check that the rebase works, push nothing"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Shield branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: shield-fix
          fetch-depth: 0
      - name: Fetch the original repository
        run: |
          git remote add upstream https://github.com/damontecres/Wholphin.git
          git fetch --no-tags upstream main
          git fetch upstream 'refs/tags/v*:refs/tags/v*'
          git log --oneline HEAD..upstream/main | head -20
      - name: Rebase
        id: rebase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without it, gh picks the "upstream" remote and targets the original repository
          GH_REPO: ${{ github.repository }}
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rebase upstream/main; then
            git status --short
            conflicts=$(git diff --name-only --diff-filter=U)
            stopped_at=$(git log -1 --format='%h %s' REBASE_HEAD 2>/dev/null || true)
            git rebase --abort
            echo "::error::Rebase conflicts with the original repository, resolve them by hand"
            # An issue makes the failure visible: a red scheduled run alone went unnoticed for days
            upstream_sha=$(git rev-parse --short upstream/main)
            title="Nightly rebase conflicts with upstream ${upstream_sha}"
            if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              printf 'Rebasing `shield-fix` on the original repository (`%s`) fails at:\n\n    %s\n\nConflicting files:\n```\n%s\n```\n\nRun: %s\n' \
                "$upstream_sha" "$stopped_at" "$conflicts" \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                | gh issue create --title "$title" --body-file - \
                || echo "::warning::Could not open an issue (are issues enabled on the repository?)"
            fi
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push
        if: steps.rebase.outputs.changed == 'true' && !inputs.dry_run
        run: |
          git push --force-with-lease origin shield-fix
          git push origin 'refs/tags/v*' || true
      - name: Build the new version
        if: steps.rebase.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run shield-build.yml --ref shield-fix
